  <line x1="70" y1="70" x2="130" y2="70" stroke="#4a90e2" stroke-width="2"/>
  <line x1="70" y1="85" x2="130" y2="85" stroke="#4a90e2" stroke-width="2"/>
  <line x1="70" y1="100" x2="110" y2="100" stroke="#4a90e2" stroke-width="2"/>

